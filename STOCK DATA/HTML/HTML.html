<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THESTOCKYs</title>

</head>
<body>
  <LI>
<div class=  "Stock-widget">
        <label for = "StockJavaID">Enter Your Ticker</label>
  <input type="text" id="StockJavaID">
    <button onclick=" getstockdata()">Forecast</button>
    <div id ="Filledstockdata"></div>
  <script>
    function getstockdata () {
      const ticker = document.getElementById('StockJavaID').value;
      jQuery(document).ready(function ($) {
          $.ajax({ url: "https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=" + ticker + "&outputsize=full&apikey=LWNPWB2MFHS0VKVV",
       dataType: "json",
        success: function (walloftext) {
              const tickerdisplay = walloftext["Meta Data"][""];
              let forecastHTML= ""

                  forecastHTML+= "Symbol-" + ticker



            document.getElementById("Filledstockdata").innerHTML = forecastHTML;

        }
        })})}
</script>
  </LI>
</body>
</html>
